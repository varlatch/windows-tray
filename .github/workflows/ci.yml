name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      # The fake CLI the tests run is a Node.js script, as the release CLI is.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Tests
        run: dotnet test tests/VarlatchKit.Tests -c Release
      - name: The PowerShell scripts parse in Windows PowerShell
        shell: powershell
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem scripts -Filter *.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors)
            foreach ($e in $errors) { $failed = $true; Write-Host "$($file.Name):$($e.Extent.StartLineNumber): $($e.Message)" }
          }
          if ($failed) { exit 1 }
      - name: Release archives build
        shell: powershell
        run: scripts/build.ps1 -Version 0.0.0
